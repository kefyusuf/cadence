name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Pinned to the image ubuntu-latest resolves to today, not to the moving label: ubuntu-latest
  # migrates to Ubuntu 26 on 2026-10-19, and a runner image change should be a decision we make,
  # not something that arrives mid-push.
  core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:deps
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run verify:package

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target test -t cadence-test .
      - run: docker run --rm cadence-test npm test
      - run: docker run --rm cadence-test sh -c "npm run lint && npm run lint:deps && npm run build && npm run verify:package"
      - run: docker build --target prod -t cadence-prod .
      - name: the prod image runs read-only, unprivileged and without capabilities
        run: docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges:true cadence-prod
      - name: the prod image's own HEALTHCHECK turns healthy
        run: |
          docker run -d --name cadence-health --read-only \
            --health-interval=1s --health-start-period=1s --health-retries=3 \
            cadence-prod node -e "setInterval(() => {}, 1000)" > /dev/null
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' cadence-health)
            echo "health after ${attempt}s: ${status}"
            if [ "${status}" = "healthy" ]; then exit 0; fi
            sleep 1
          done
          docker inspect --format '{{json .State.Health}}' cadence-health
          exit 1
      - if: always()
        run: docker rm -f cadence-health > /dev/null || true
