name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Pinned to the image ubuntu-latest resolves to today, not to the moving label: ubuntu-latest
  # migrates to Ubuntu 26 on 2026-10-19, and a runner image change should be a decision we make,
  # not something that arrives mid-push.
  core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:deps
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run verify:package

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target test -t cadence-test .
      - run: docker run --rm cadence-test npm test
      - run: docker run --rm cadence-test sh -c "npm run lint && npm run lint:deps && npm run build && npm run verify:package"
      - run: docker build --target prod -t cadence-prod .
      # One container, all three hardening flags, and the command is the service: this is the same proof
      # the short-lived self-check run used to give, now given by a process that has to stay up. The
      # health probe is the image's own, which asks `GET /healthz` over loopback — so `healthy` means the
      # route answered, not that the process exists.
      - name: the prod image serves read-only, unprivileged and without capabilities
        run: |
          docker run -d --name cadence-prod-check --read-only --cap-drop=ALL \
            --security-opt no-new-privileges:true \
            --health-interval=1s --health-start-period=1s --health-retries=3 cadence-prod > /dev/null
          status=none
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' cadence-prod-check)
            echo "health after ${attempt}s: ${status}"
            if [ "${status}" = "healthy" ]; then break; fi
            sleep 1
          done
          if [ "${status}" != "healthy" ]; then
            docker inspect --format '{{json .State.Health}}' cadence-prod-check
            exit 1
          fi
      # The discriminator is the exit code: a process that handles SIGTERM and closes the server exits 0,
      # and one that had to be killed by the grace period exits 137.
      - name: a stop request ends the service by itself
        run: |
          docker stop --time 5 cadence-prod-check > /dev/null
          docker logs cadence-prod-check 2>&1 | tail -3
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' cadence-prod-check)
          echo "exit code after SIGTERM: ${exit_code}"
          test "${exit_code}" = "0"
      - if: always()
        run: docker rm -f cadence-prod-check > /dev/null || true
